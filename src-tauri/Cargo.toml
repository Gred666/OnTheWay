[package]
name = "ontheway"
version = "0.1.0"
description = "笔记、待办、目标与日历一体的个人效率工具"
authors = ["OnTheWay"]
edition = "2021"
rust-version = "1.77"

[features]
default = ["desktop-runtime"]
desktop-runtime = [
  "dep:tauri",
  "dep:tauri-specta",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-window-state",
  "dep:tauri-plugin-single-instance",
  "tauri/wry",
  "tauri/compression",
  "tauri/common-controls-v6",
  "tauri/dynamic-acl",
  "tauri/x11",
  "tauri/dbus",
]
# capabilities/default.json 引用了 opener / window-state 的权限，tauri-build 生成 ACL 时
# 要能找到这两个插件，所以导出绑定也得带上它们
typegen = [
  "dep:tauri",
  "dep:tauri-specta",
  "tauri/test",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-window-state",
]

[lib]
# 桌面端二进制和未来的移动端共用这个 lib
name = "ontheway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：笔记里 `![](C:\…\a.png)` 这类本机图片走 asset 协议（tauri.conf.json
# 里开了 assetProtocol）。必须写在这一行的 features 里 —— tauri-build 只核对这里，
# 写在上面 [features] 里的话，不经 tauri CLI 直接 cargo build / 导出绑定都会被它拦下。
tauri = { version = "2", default-features = false, features = ["protocol-asset"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
# 「更换笔记文件夹」的选择文件夹对话框和确认框（只在 Rust 里调，前端不需要权限）
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- 数据层 ---
# 文件是真相（仓库文件夹里的 .md），SQLite 只做可以重建的索引，外加读旧版的库。
# bundled 从源码编译 SQLite，自带 FTS5，且不依赖系统 SQLite 版本 ——
# 否则 Windows / macOS 上的版本差异会让 FTS 行为不一致
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# 监听仓库文件夹：外部程序改了文件，索引跟上、前端刷新
notify = "8"
# 搬旧数据时把文件的修改时间设回原来的「上次更新」
filetime = "0.2"

# --- 中文分词 ---
# FTS5 默认分词器不切中文；trigram 又搜不到双字词。
# 详见技术方案 §6。
jieba-rs = "0.7"

uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
once_cell = "1"

# --- 类型安全的 IPC 绑定 ---
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"], optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[[example]]
name = "export_bindings"
required-features = ["typegen"]
