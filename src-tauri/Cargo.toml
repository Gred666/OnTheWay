[package]
name = "ontheway"
version = "0.1.0"
description = "笔记、待办、目标与日历一体的个人效率工具"
authors = ["OnTheWay"]
edition = "2021"
rust-version = "1.77"

[features]
default = ["desktop-runtime"]
desktop-runtime = [
  "dep:tauri",
  "dep:tauri-specta",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-window-state",
  "dep:tauri-plugin-single-instance",
  "tauri/wry",
  "tauri/compression",
  "tauri/common-controls-v6",
  "tauri/dynamic-acl",
  "tauri/x11",
  "tauri/dbus",
]
typegen = ["dep:tauri", "dep:tauri-specta", "tauri/test"]

[lib]
# 桌面端二进制和未来的移动端共用这个 lib
name = "ontheway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- 数据层 ---
# bundled 从源码编译 SQLite，自带 FTS5，且不依赖系统 SQLite 版本 ——
# 否则 Windows / macOS 上的版本差异会让 FTS 行为不一致
rusqlite = { version = "0.32", features = ["bundled", "backup", "chrono", "uuid"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# --- 中文分词 ---
# FTS5 默认分词器不切中文；trigram 又搜不到双字词。
# 详见技术方案 §6。
jieba-rs = "0.7"

uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rrule = "0.14"
thiserror = "2"
once_cell = "1"

# --- 类型安全的 IPC 绑定 ---
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"], optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[[example]]
name = "export_bindings"
required-features = ["typegen"]
