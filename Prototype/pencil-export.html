<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nothing+You+Could+Do%3Awght%40400&display=swap"
      rel="stylesheet"
    />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="Brand"
      class="box-border w-full h-[36px] shrink-0 flex flex-row gap-0 p-[0px_4px] justify-between items-center"
    >
      <div
        data-pencil-name="Brand Wordmark"
        class="text-[25px]/[normal] box-border [filter:drop-shadow(0px_4px_2px_#00000069)] text-[#1A1A18] font-['Nothing_You_Could_Do',system-ui,sans-serif] font-medium tracking-[-0.6px] text-left [white-space:nowrap]"
      >
        OnTheWay
      </div>
    </div>
  </body>
</html>
